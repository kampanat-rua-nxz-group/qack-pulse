name: dashboard

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *' # 04:00 UTC = 11:00 Asia/Bangkok daily
    - cron: '0 5 * * 1-5' # 05:00 UTC = 12:00 Asia/Bangkok, after the test schedules (02:00-03:15 UTC start, UI run can end after 04:00)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Newest cache wins. Each run saves under its own key, so the file keeps growing.
      - name: Restore history
        uses: actions/cache/restore@v4
        with:
          path: data/history.jsonl
          key: history-${{ github.run_id }}
          restore-keys: history-

      - name: Build dashboard
        run: npm run dashboard -- --no-open
        env:
          GH_TOKEN: ${{ secrets.QACK_PULSE_TOKEN }}

      - name: Save history
        uses: actions/cache/save@v4
        with:
          path: data/history.jsonl
          key: history-${{ github.run_id }}

      # Only encrypted pages go to Pages. dashboard.json stays out of site/.
      # dashboard.html is the same page as index.html, so the history page's back link resolves.
      - name: Lock pages with passcode
        run: |
          node src/lock.ts out/dashboard.html site/index.html
          cp site/index.html site/dashboard.html
          node src/lock.ts out/history.html site/history.html
        env:
          PULSE_PASSCODE: ${{ secrets.PULSE_PASSCODE }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
